<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">QR Studio application preview</title>
  <desc id="desc">Dark desktop interface with QR customization controls, a generated QR code, and recent history.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1e293b" stop-opacity=".96"/>
      <stop offset="1" stop-color="#111827" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="720" height="560" fill="url(#bg)"/>
  <circle cx="620" cy="80" r="120" fill="#4f46e5" opacity=".15" filter="url(#glow)"/>
  <circle cx="80" cy="500" r="150" fill="#06b6d4" opacity=".08" filter="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="38" y="40" width="644" height="480" rx="22" fill="#0b0f19" stroke="#334155" stroke-width="2"/>
    <path d="M38 92h644" stroke="#334155"/>
    <circle cx="68" cy="66" r="6" fill="#f87171"/><circle cx="90" cy="66" r="6" fill="#fbbf24"/><circle cx="112" cy="66" r="6" fill="#34d399"/>
    <rect x="144" y="57" width="130" height="19" rx="9.5" fill="#1e293b"/>
    <text x="159" y="71" fill="#c7d2fe" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3">QR STUDIO</text>

    <rect x="58" y="112" width="184" height="388" rx="15" fill="url(#panel)" stroke="#334155"/>
