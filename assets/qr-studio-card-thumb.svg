      <rect x="366" y="216" width="12" height="12"/><rect x="388" y="206" width="12" height="34"/><rect x="410" y="218" width="34" height="12"/><rect x="454" y="218" width="12" height="34"/><rect x="476" y="216" width="22" height="12"/>
      <rect x="366" y="250" width="34" height="12"/><rect x="410" y="250" width="12" height="34"/><rect x="432" y="262" width="34" height="12"/><rect x="476" y="250" width="22" height="12"/>
      <rect x="366" y="294" width="12" height="34"/><rect x="388" y="284" width="34" height="12"/><rect x="432" y="296" width="12" height="34"/><rect x="454" y="284" width="44" height="12"/><rect x="476" y="306" width="22" height="34"/>
      <rect x="366" y="340" width="34" height="12"/><rect x="410" y="328" width="12" height="24"/><rect x="432" y="340" width="34" height="12"/>
