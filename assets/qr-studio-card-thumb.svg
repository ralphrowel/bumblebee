      <rect x="570" y="177" width="30" height="30" rx="4" fill="#eef2ff"/><path d="M576 183h8v8h-8zm13 0h5v5h-5zm-13 13h5v5h-5zm9-4h9v9h-9z" fill="#4338ca"/>
      <text x="570" y="223" fill="#cbd5e1" font-size="8" font-weight="700">Portfolio link</text><text x="570" y="238" fill="#64748b" font-size="7">300px · M</text>
      <rect x="558" y="263" width="90" height="87" rx="10" fill="#0f172a" stroke="#334155"/>
      <rect x="570" y="276" width="30" height="30" rx="4" fill="#ecfdf5"/><path d="M576 282h8v8h-8zm13 0h5v5h-5zm-13 13h5v5h-5zm9-4h9v9h-9z" fill="#065f46"/>
