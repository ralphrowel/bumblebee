      <rect x="558" y="362" width="90" height="87" rx="10" fill="#0f172a" stroke="#334155"/>
      <rect x="570" y="375" width="30" height="30" rx="4" fill="#fff1f2"/><path d="M576 381h8v8h-8zm13 0h5v5h-5zm-13 13h5v5h-5zm9-4h9v9h-9z" fill="#9f1239"/>
      <text x="570" y="421" fill="#cbd5e1" font-size="8" font-weight="700">Contact card</text><text x="570" y="436" fill="#64748b" font-size="7">600px · H</text>
