    <text x="78" y="166" fill="#64748b" font-family="Arial, sans-serif" font-size="9" letter-spacing="1">CONTENT TYPE</text>
    <rect x="78" y="178" width="144" height="31" rx="7" fill="#312e81" stroke="#6366f1"/>
    <text x="91" y="198" fill="#e0e7ff" font-family="Arial, sans-serif" font-size="11">Website URL</text>
    <text x="78" y="232" fill="#64748b" font-family="Arial, sans-serif" font-size="9" letter-spacing="1">DESTINATION</text>
    <rect x="78" y="243" width="144" height="35" rx="7" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="265" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9">https://your-link.com</text>
    <text x="78" y="302" fill="#64748b" font-family="Arial, sans-serif" font-size="9" letter-spacing="1">COLOR PRESETS</text>
