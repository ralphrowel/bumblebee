    <text x="393" y="397" text-anchor="middle" fill="#e0e7ff" font-family="Arial, sans-serif" font-size="9" font-weight="700">LIVE PREVIEW</text>

    <rect x="544" y="112" width="118" height="388" rx="15" fill="url(#panel)" stroke="#334155"/>
