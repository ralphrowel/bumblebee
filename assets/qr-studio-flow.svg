<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">QR Studio generation and export workflow</title>
  <desc id="desc">Architecture diagram showing content forms flowing through formatting, QR generation, styling, live preview, export, clipboard, and session history.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0f19"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#818cf8"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#6366f1"/></marker>
    <style>
      .node{fill:#111827;stroke:#334155;stroke-width:2}.node-accent{fill:#17183d;stroke:#6366f1;stroke-width:2}.title{font:700 28px Arial,sans-serif;fill:#f8fafc;letter-spacing:2px}.eyebrow{font:700 13px Arial,sans-serif;fill:#818cf8;letter-spacing:3px}.label{font:700 17px Arial,sans-serif;fill:#f8fafc}.sub{font:400 12px Arial,sans-serif;fill:#94a3b8}.pill{fill:#1e293b;stroke:#334155}.pilltext{font:700 10px Arial,sans-serif;fill:#cbd5e1;letter-spacing:.5px}.flow{fill:none;stroke:#6366f1;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="820" fill="url(#bg)"/>
  <circle cx="1250" cy="100" r="210" fill="#4f46e5" opacity=".07"/><circle cx="150" cy="750" r="240" fill="#06b6d4" opacity=".05"/>
  <text x="70" y="70" class="eyebrow">QR STUDIO / APPLICATION FLOW</text>
  <text x="70" y="112" class="title">FROM STRUCTURED INPUT TO SCANNABLE OUTPUT</text>
  <text x="70" y="142" class="sub">A modular desktop pipeline built for responsive previews, reliable encoding, and repeatable branded exports.</text>

  <g filter="url(#glow)">
    <rect x="70" y="220" width="245" height="340" rx="20" class="node"/>
    <rect x="70" y="220" width="245" height="58" rx="20" fill="url(#indigo)"/><path d="M70 258h245v20H70z" fill="url(#indigo)"/>
    <text x="94" y="255" class="label">Content Forms</text>
    <g transform="translate(94 307)">
      <rect width="86" height="32" rx="16" class="pill"/><text x="43" y="20" text-anchor="middle" class="pilltext">URL</text>
      <rect x="100" width="86" height="32" rx="16" class="pill"/><text x="143" y="20" text-anchor="middle" class="pilltext">WIFI</text>
      <rect y="48" width="86" height="32" rx="16" class="pill"/><text x="43" y="68" text-anchor="middle" class="pilltext">VCARD</text>
      <rect x="100" y="48" width="86" height="32" rx="16" class="pill"/><text x="143" y="68" text-anchor="middle" class="pilltext">EMAIL</text>
      <rect y="96" width="86" height="32" rx="16" class="pill"/><text x="43" y="116" text-anchor="middle" class="pilltext">SMS</text>
      <rect x="100" y="96" width="86" height="32" rx="16" class="pill"/><text x="143" y="116" text-anchor="middle" class="pilltext">NOTE</text>
    </g>
    <text x="94" y="473" class="sub">Dedicated inputs collect only the</text><text x="94" y="491" class="sub">fields each QR standard requires.</text>
    <text x="94" y="525" class="sub" fill="#818cf8">Input validation + URL sanitization</text>

    <rect x="405" y="220" width="245" height="150" rx="20" class="node"/>
    <text x="431" y="255" class="eyebrow">01 / FORMAT</text><text x="431" y="290" class="label">Payload Utilities</text>
    <text x="431" y="320" class="sub">WiFi · vCard 3.0 · mailto · SMSTO</text><text x="431" y="342" class="sub">Standards-ready serialized strings</text>

    <rect x="405" y="410" width="245" height="150" rx="20" class="node-accent"/>
    <text x="431" y="445" class="eyebrow">02 / GENERATE</text><text x="431" y="480" class="label">QR Matrix Engine</text>
    <text x="431" y="510" class="sub">qrcode[pil] + L / M / Q / H</text><text x="431" y="532" class="sub">Adaptive logo-safe correction</text>

    <rect x="740" y="220" width="245" height="340" rx="20" class="node-accent"/>
    <text x="766" y="255" class="eyebrow">03 / STYLE</text><text x="766" y="290" class="label">Pillow Composer</text>
    <g transform="translate(766 322)">
      <rect width="192" height="48" rx="10" class="pill"/><text x="18" y="20" class="pilltext">PALETTE</text><text x="18" y="36" class="sub">6 presets + custom colors</text>
      <rect y="62" width="192" height="48" rx="10" class="pill"/><text x="18" y="82" class="pilltext">BRANDING</text><text x="18" y="98" class="sub">Logo mask + caption</text>
      <rect y="124" width="192" height="48" rx="10" class="pill"/><text x="18" y="144" class="pilltext">RESOLUTION</text><text x="18" y="160" class="sub">150 · 300 · 450 · 600 px</text>
    </g>
    <text x="766" y="523" class="sub">Composites a polished, export-ready image.</text>

    <rect x="1075" y="220" width="295" height="150" rx="20" class="node"/>
    <text x="1101" y="255" class="eyebrow">04 / PREVIEW</text><text x="1101" y="290" class="label">Debounced Live Canvas</text>
    <text x="1101" y="320" class="sub">Updates as the user types without</text><text x="1101" y="342" class="sub">blocking the Tkinter event loop.</text>

    <rect x="1075" y="410" width="295" height="150" rx="20" class="node"/>
    <text x="1101" y="445" class="eyebrow">05 / DELIVER</text><text x="1101" y="480" class="label">Output Destinations</text>
    <g transform="translate(1101 505)"><rect width="70" height="30" rx="15" class="pill"/><text x="35" y="19" text-anchor="middle" class="pilltext">EXPORT</text><rect x="80" width="82" height="30" rx="15" class="pill"/><text x="121" y="19" text-anchor="middle" class="pilltext">CLIPBOARD</text><rect x="172" width="82" height="30" rx="15" class="pill"/><text x="213" y="19" text-anchor="middle" class="pilltext">HISTORY</text></g>
  </g>

  <path d="M315 390h45c25 0 25-95 45-95" class="flow"/><path d="M315 390h45c25 0 25 95 45 95" class="flow"/>
  <path d="M650 485h45c28 0 18-95 45-95" class="flow"/><path d="M985 390h45c25 0 20-95 45-95" class="flow"/><path d="M1222 370v40" class="flow"/>

  <rect x="70" y="650" width="1300" height="94" rx="18" fill="#0f172a" stroke="#334155"/>
  <text x="98" y="686" class="eyebrow">STATE LOOP</text>
  <text x="98" y="718" class="sub">Each history entry stores its thumbnail, content type, complete form snapshot, palette, resolution, correction level, and label for one-click restoration.</text>
  <path d="M1288 697h-130" stroke="url(#cyan)" stroke-width="4" stroke-linecap="round"/><circle cx="1146" cy="697" r="8" fill="#67e8f9"/>
</svg>
